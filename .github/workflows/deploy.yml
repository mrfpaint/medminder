name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy public/ to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name medminder-app --branch main
          # records the deploy against the commit, so status shows in the repo
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
